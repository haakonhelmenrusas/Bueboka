applied_migrations = [
    "bash_read_only_defaults_v1",
]

[project_context]
extra_files = [
    "VIBE.md",
    "CLAUDE.md",
    "README.md",
]
commit_count = 10
timeout_seconds = 3.0

[skills]
skill_paths = [
    ".agents/skills",
]
enabled_skills = [
    "bueboka-context",
]

[tools.read]
max_read_bytes = 100000

[tools.grep]
max_output_bytes = 100000
default_max_matches = 200

[tools.edit]
permission = "always"

[tools.write_file]
permission = "always"
create_parent_dirs = true

[tools.bash]
permission = "always"
allowlist = [
    "basename",
    "cat",
    "cd",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "eas",
    "echo",
    "expo",
    "file",
    "find",
    "fmt",
    "fold",
    "git",
    "grep",
    "head",
    "jest",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "npm",
    "npx",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "wc",
    "which",
    "yarn",
]

[agents]
agent_paths = [
    ".agents",
]

[context]
include_project_readme = true
include_git_status = true
include_recent_commits = 10
